  </table></div>`}var Je=r=>`<p class="tip"><span class="caution" aria-hidden="true"></span><span>${r}</span></p>`;function Lr(){let r=O,e=["coal","nuclear","wind","solar"],t=["police","fire","school","hospital","park","stadium","airport","seaport"].map(i=>[i,ti[i]]);return[{id:"start",title:"The first ten minutes",html:`
        <p>Every city starts the same way: power, a few lots of each kind, roads between them, and wires to the lots. A new city starts paused, so nothing happens until you are ready.</p>
        <ol class="steps">
          <li><b>Build a coal plant.</b> It costs ${fe(r.coal.cost)} and makes ${r.coal.capacity} MW, enough for about ${Math.floor(r.coal.capacity/9)} lots. Put it at the edge of where the town will go, because it pollutes heavily.</li>
          <li><b>Lay a road spine</b> through open, gentle ground. Roads every 7 tiles leave room for a 2\xD72 block of lots, and every lot in the block touches a road.</li>
          <li><b>Zone a mix.</b> Start with about four residential lots, two industrial and one or two commercial. Keep industry at least a block away from the houses.</li>
          <li><b>Run a power line</b> from the plant to the nearest lot. Lots that touch each other pass power along, so one wire can feed a whole block, but not across a road: give each block its own short wire, or run one line along the road past them.</li>
          <li><b>Press play</b> (or <kbd>Space</kbd>). Watch the RCI meter at the top and zone more of whatever bar is tallest.</li>
        </ol>
        <figure class="scene" data-scene="starter"><figcaption>A starter town: a coal plant wired into the grid along the top road, homes, a shop and a park inside two blocks, and industry across the road to the south, away from the lake.</figcaption></figure>
        ${Je("A lot flashing a lightning bolt has no power. The fix is almost always a short power line, because power does not travel along roads.")}`},{id:"growth",title:"Why lots grow, or don\u2019t",html:`
        <p>A lot develops only when all three of these hold:</p>
        <ul>
          <li><b>Power.</b> Unpowered lots never grow, and built ones empty out.</li>
          <li><b>A road touching the lot</b> on at least one side. A corner touching diagonally does not count.</li>
          <li><b>A commute.</b> Homes need to reach a shop or factory, and shops and factories need to reach homes, within about 80 road tiles.</li>
        </ul>
        <p>Then <b>demand</b> and local conditions decide how fast it grows. With the matching bar on the RCI meter above the line, lots in decent spots fill in. Below the line, lots in the best spots still grow, only more slowly, and poor ones start to empty out.</p>
        <p>Growth is gradual. Each month a qualifying lot has a small chance to go up one density level, and a better score raises that chance. Pick <b>Inspect</b> (<kbd>Q</kbd>) and click a lot to see its density, residents or jobs, any problem such as \u201CNo road access\u201D or \u201CCommute too long\u201D, how dense it can grow where it stands, and its outlook.</p>
        <p>What counts as a good spot differs by zone:</p>
        <ul>
          <li><b>Homes</b> want high land value, clean air, low crime, and schools or hospitals nearby.</li>
          <li><b>Shops</b> want land value and low crime, and put up with some pollution.</li>
          <li><b>Industry</b> prefers cheap land and ignores pollution. It is happiest on the unloved side of town.</li>
        </ul>`},{id:"demand",title:"The RCI meter",html:`
        <p>The three bars at the top show demand for residential, commercial and industrial space. Bars above the line mean people want more of that zone. Bars below mean there is too much.</p>
        <p>Demand follows simple ratios:</p>
        <ul>
          <li><b>Residents follow jobs.</b> Each job supports about two residents.</li>
          <li><b>Commerce follows people.</b> Shops and offices want roughly one job for every four or five residents.</li>
          <li><b>Industry exports.</b> Factories want about three jobs for every ten residents.</li>
        </ul>
        <p>Taxes push all three bars at once. Each point above 7% pulls them down, and each point below pushes them up.</p>
        <p>Three limits stop a city cold until you build the landmark it needs, and the news ticker tells you when you hit one:</p>
        ${Ze(["Limit","Needs"],[[`Housing past ${Fe.res.toLocaleString()} residents`,"Stadium"],[`Commerce past ${Fe.com.toLocaleString()} jobs`,"Airport"],[`Industry past ${Fe.ind.toLocaleString()} jobs`,"Seaport, touching water"]])}
        ${Je("If a bar is high but nothing grows, check the lots rather than the meter: power, a touching road, the commute, and land value: Inspect shows the most a lot can grow where it stands, and what holds it back.")}`},{id:"density",title:"Density and land value",html:`
        <p>How tall a lot can grow depends on its land value, which the Inspect tool shows in dollars per acre. Cheap land stays low-rise no matter how high demand gets.</p>
        <div class="ladder" data-ladder="res"></div>
        <div class="ladder" data-ladder="com"></div>
        <div class="ladder" data-ladder="ind"></div>
        <p>For housing, schools and hospitals nearby count for up to $1,200/acre towards these thresholds. Industry has no land value threshold and tops out at level 4.</p>
        <p>Land value builds up from:</p>
        ${Ze(["Raises it","Up to"],[["Water within 6 tiles","+$1,680"],["Being close to the centre of town","+$1,920"],["Parks nearby","+$1,100"],["Schools and hospitals nearby","+$2,240"],["Hills and high ground","+$960"],["Trees nearby","+$880"],["Landmark upgrades, all six",`+${fe(6*Qe*40)}`]],[1])}
        <p>Pollution is the big one on the other side: every point of it costs more than crime or traffic does. A lot next to heavy industry can lose most of its value.</p>
        ${Je("Parks cost $10 each. A ring of them around a block adds a few hundred dollars an acre, enough to tip a lot that is just short of a threshold. A school or hospital nearby does far more.")}`},{id:"power",title:"Power",html:`
        ${Ze(["Plant","Cost","Output","Upkeep","Notes"],e.map(i=>[r[i].name,fe(r[i].cost),`${r[i].capacity} MW`,`${fe(r[i].upkeep)}/mo`,i==="coal"?"Heavy pollution":i==="nuclear"?"Clean, rare meltdown risk":i==="wind"?"1\xD71, fine on hilltops":"Clean and quiet"]),[1,2,3])}
        <ul>
          <li>Every tile of every building draws 1 MW, so a 3\xD73 lot needs 9 MW even while it is still vacant.</li>
          <li>Power flows through power lines and through buildings that touch, except parks. Roads and rail do not carry it. You can string a power line along an existing road.</li>
          <li>The grid updates the moment you build, even while paused. A flashing bolt on a lot means no power reaches it yet.</li>
          <li>When a grid needs more than its plants make, the lots furthest from its plants go dark first. The news ticker warns about brownouts.</li>
          <li>Plants only share power within one connected grid. Two plants on grids that never touch can leave one short while the other has plenty spare, even when the Report's city-wide total looks fine. The Power grid layer shows overloaded grids in orange, and Inspect on any lot or line gives its grid's load.</li>
        </ul>
        ${Je("Build the next plant when demand reaches about 80% of supply. The Report shows both numbers.")}`},{id:"traffic",title:"Roads, rail and traffic",html:`
        ${Ze(["","Cost per tile","Bridge","Upkeep","Steepest step it climbs"],[["Road",fe(Ue.road),fe(ut.road),`$${Oe.road}/mo`,`${Et.road} m`],["Rail",fe(Ue.rail),fe(ut.rail),`$${Oe.rail}/mo`,`${Et.rail} m`],["Power line",fe(Ue.power),fe(ut.power),"free","any"]],[1,2,3,4])}
        <p>Residents spread their commutes over the city\u2019s biggest employers, so traffic piles up on the roads leading downtown and into the industrial district. Busy roads add pollution and lower nearby land value, and jammed roads make commutes slower, which spreads traffic onto parallel streets.</p>
        <ul>
          <li><b>Rail</b> is cheaper to travel on than any road, and trips by rail add no cars. Link rail to the road network at both ends and it pulls commuters off the busiest streets. A street can cross the track: trains pass through without adding cars. Lots that touch a rail line put their commuters straight on the train, though they still need a road touching them to grow.</li>
          <li><b>Mixed zoning</b> shortens commutes. A pocket of commercial lots inside a residential district keeps many trips off the main roads.</li>
          <li><b>Parallel roads</b> share the load. One long arterial carrying everything will jam.</li>
        </ul>
        ${Je("Turn on the Traffic layer to see which roads are jammed before you build anything to fix them.")}`},{id:"money",title:"Money",html:`
        <p>Taxes arrive monthly. Every resident pays, jobs count for 70% of a resident, and the total is scaled by the city\u2019s average land value. A city of valuable land collects up to 2.6 times as much per person as a cheap one, so raising land value is the best way to raise revenue.</p>
        <ul>
          <li><b>7%</b> keeps demand neutral. Residents start to grumble about taxes above about 12%, and every point above 7% slows growth.</li>
          <li><b>Upkeep</b> is charged monthly: roads and rail by the tile, police and fire by the station (scaled by their funding), and each plant and service building.</li>
          <li><b>Loans</b> come in $10,000 steps up to $30,000 at 7% a year. They are worth it to fund a plant or a landmark that unlocks growth, not to cover running costs.</li>
          <li><b>In debt</b> nothing new can be built, but bulldozing still works at $1 a tile, so you can clear away what the city can\u2019t afford to run.</li>
          <li><b>Underfunding</b> police or fire weakens their reach. Cutting roads and rail below 90% makes tiles crumble into rubble every month.</li>
        </ul>
        ${Je("The Budget pauses the game and shows last month and the year so far line by line. The History charts show whether income is keeping up with spending.")}`},{id:"services",title:"Services and landmarks",html:`
        ${Ze(["Building","Cost","Upkeep","What it does"],t.map(([i,s])=>[r[i].name,fe(r[i].cost),r[i].upkeep<1?`$${r[i].upkeep}/mo`:`${fe(r[i].upkeep)}/mo`,s]),[1,2])}
        <p>Crime grows where people are crowded and land is cheap. Police coverage cancels it out, so place stations in dense, low-value neighbourhoods first. Service buildings need power too; an unpowered station works at about a third of its strength.</p>
        <p>Once a city has money to spare, each landmark can be upgraded twice from its Inspect card. Every upgrade raises land value across the whole city by ${fe(Qe*40)}/acre, so homes and shops can grow denser and taxes bring in more, but they cost a lot and add to the upkeep. Only the most upgraded stadium, seaport and airport count, so upgrading a second one adds nothing.</p>
        ${Ze(["Landmark","First upgrade","Second upgrade"],["stadium","seaport","airport"].map(i=>[r[i].name,...$t[i].map(s=>`${s.name}<br>${fe(s.cost)}, +${fe(s.upkeep)}/mo`)]))}
        ${Je("Turn on the Police reach, Fire cover or Schools & health layer to find the gaps in coverage.")}`},{id:"terrain",title:"Building on hills",html:`
        <ul>
          <li><b>Zones and buildings</b> level their own lot when the ground is moderately sloped, up to ${si} times their normal limit. The cursor price includes the earthworks.</li>
          <li><b>Roads and rail</b> only care about the slope along the line, so they can run across a hillside freely. Where they climb too steeply they cut themselves a ramp, also priced in.</li>
          <li><b>Level land</b> (<kbd>L</kbd>) is for anything steeper. Hold it over the slope and it flattens toward the height where you first pressed, at ${fe(He)} per metre of earth moved. Selecting it turns on the Steepness layer, and the cursor shows the steepness underneath.</li>
        </ul>
        ${Je("High ground adds land value, and so does a view of water. A gentle hillside above a lake is prime residential land.")}`},{id:"disasters",title:"Disasters",html:`
        <p>Random disasters start once a city passes ${Ge.toLocaleString()} residents, about when it needs its first fire station, and can be switched off from the Disasters menu. Harder difficulties bring them more often.</p>
        ${Ze(["Disaster","How to prepare"],[["Fire","The most common by far. Fire stations prevent fires and put them out. Buildings far from a station catch fire more often, and fire spreads through trees and touching buildings. Bulldoze a gap to stop it."],["Flood","Starts on low shoreline and spreads over land a few metres above the water. Keep valuable buildings on higher ground."],["Tornado","Wanders near the town centre. You cannot stop it, so keep money in reserve to rebuild."],["Earthquake","Wrecks buildings and roads within about 16 tiles and starts fires. Good fire cover limits the damage."],["Monster","Appears only when pollution is high, comes out of the water, and heads for the most polluted spot, leaving fires in what it wrecks. Clean air keeps it away."],["Meltdown","Only with a nuclear plant: a small chance each month, or if the plant is destroyed. It contaminates the area for years."]])}
        ${Je("Every message in the news ticker with a location has a Go there button.")}`},{id:"challenges",title:"Challenges",html:`
        ${Ze(["Challenge","How to approach it"],[["Boomtown","Money is tight. Build one coal plant and lay roads every 7 tiles to save asphalt. Then zone well ahead of the RCI meter, a dozen or more lots of housing and a few of shops and industry early on: each lot fills in slowly, so the number of lots sets the pace, and money for roads is the limit, not demand. Twelve thousand residents needs roughly six thousand jobs."],["Gridlock","The city opens with about 17,500 people and more jobs than it can keep: with no airport or seaport, shops and factories shrink back to the landmark limits, and people leave with the jobs. Build both to hold on to 10,000 jobs. Every new job and resident brings more cars, though, so run rail from the outer housing into downtown, add parallel roads beside the busy ones, and zone pockets of commerce inside the residential rings. Schools, hospitals and parks raise land value, which lets the city grow denser, and busier."],["Smog Valley","The coal plants are the worst polluters. Replace them with nuclear, solar or wind, plant trees and parks between the factories and the homes, and bulldoze the industry that sits closest to houses. Housing stops at 18,000 residents until you build a stadium. The goal has to hold at every month end of the last year, so get there with time to spare."],["Aftershock","Put the fires out first: check fire cover and bulldoze firebreaks. Then clear rubble, reconnect roads and power, push land value up with hospitals and schools, and build a seaport so industry can grow, to reach 55,000."],["Monster Bay","The monster returns about every two years and makes for the smoke, which here means the coal plants. Switch to solar or wind: a nuclear plant the monster smashes melts down. Keep fire cover up for the fires it starts, and keep taxes near 7% to hold approval above 60%. Housing stops at 18,000 residents until you build a stadium."]])}`},{id:"classes",title:"City sizes",html:`${Ze(["Class","Residents"],Le.map(i=>[i.na
