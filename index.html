          <li><b>Power.</b> Unpowered lots never grow, and built ones empty out.</li>
          <li><b>A road touching the lot</b> on at least one side. A corner touching diagonally does not count.</li>
          <li><b>A commute.</b> Homes need to reach a shop or factory, and shops and factories need to reach homes, within about 80 road tiles.</li>
        </ul>
        <p>Then <b>demand</b> and local conditions decide how fast it grows. With the matching bar on the RCI meter above the line, lots in decent spots fill in. Below the line, lots in the best spots still grow, only more slowly, and poor ones start to empty out.</p>
        <p>Growth is gradual. Each month a qualifying lot has a small chance to go up one density level, and the better its spot, the higher that chance. Pick <b>Inspect</b> (<kbd>Q</kbd>) and click a lot to see its density, residents or jobs, any problem such as \u201CNo road access\u201D or \u201CCommute too long\u201D, how dense it can grow where it stands, and its outlook.</p>
        <p>What counts as a good spot differs by zone:</p>
        <ul>
          <li><b>Homes</b> want high land value, clean air, low crime, and schools or hospitals nearby.</li>
          <li><b>Shops</b> want land value and low crime, and put up with some pollution.</li>
          <li><b>Industry</b> prefers cheap land and ignores pollution. It is happiest on the unloved side of town.</li>
        </ul>`},{id:"demand",title:"The RCI meter",html:`
        <p>The three bars at the top show demand for residential, commercial and industrial space. Bars above the line mean people want more of that zone. Bars below mean there is too much.</p>
        <p>Demand follows simple ratios:</p>
        <ul>
          <li><b>Residents follow jobs.</b> Each job supports about two residents.</li>
          <li><b>Commerce follows people.</b> Shops and offices want roughly one job for every four or five residents.</li>
          <li><b>Industry exports.</b> Factories want about three jobs for every ten residents.</li>
        </ul>
        <p>Taxes push all three bars at once. Each point above 7% pulls them down, and each point below pushes them up.</p>
        <p>Three limits stop a city cold until you build the landmark it needs, and the news ticker tells you when you hit one:</p>
        ${Ye(["Limit","Needs"],[[`Housing past ${Ee.res.toLocaleString()} residents`,"Stadium"],[`Commerce past ${Ee.com.toLocaleString()} jobs`,"Airport"],[`Industry past ${Ee.ind.toLocaleString()} jobs`,"Seaport, touching water"]])}
        ${Xe("If a bar is high but nothing grows, check the lots rather than the meter: power, a touching road, the commute, and land value: Inspect shows the most a lot can grow where it stands, and what holds it back.")}`},{id:"density",title:"Density and land value",html:`
        <p>How tall a lot can grow depends on its land value, which the Inspect tool shows in dollars per acre. Cheap land stays low-rise no matter how high demand gets.</p>
        <div class="ladder" data-ladder="res"></div>
        <div class="ladder" data-ladder="com"></div>
        <div class="ladder" data-ladder="ind"></div>
        <p>For housing, schools and hospitals nearby count for up to $1,200/acre towards these thresholds. Industry has no land value threshold and tops out at level 4.</p>
        <p>Land value builds up from:</p>
        ${Ye(["Raises it","Up to"],[["Water within 6 tiles","+$1,680"],["Being close to the centre of town","+$1,920"],["Parks nearby","+$1,100"],["Schools and hospitals nearby","+$2,240"],["Hills and high ground","+$960"],["Trees nearby","+$880"],["Landmark upgrades, all six",`+${be(6*et*40)}`]],[1])}
        <p>Pollution is the big one on the other side: every point of it costs more than crime or traffic does. A lot next to heavy industry can lose most of its value.</p>
        ${Xe("Parks cost $10 each. A ring of them around a block adds a few hundred dollars an acre, enough to tip a lot that is just short of a threshold. A school or hospital nearby does far more.")}`},{id:"power",title:"Power",html:`
        ${Ye(["Plant","Cost","Output","Upkeep","Notes"],e.map(i=>[r[i].name,be(r[i].cost),`${r[i].capacity} MW`,`${be(r[i].upkeep)}/mo`,i==="coal"?"Heavy pollution":i==="nuclear"?"Clean, rare meltdown risk":i==="wind"?"1\xD71, fine on hilltops":"Clean and quiet"]),[1,2,3])}
        <ul>
          <li>Every tile of every building draws 1 MW, so a 3\xD73 lot needs 9 MW even while it is still vacant.</li>
          <li>Power flows through power lines and through buildings that touch, except parks. Roads and rail do not carry it. You can string a power line along an existing road.</li>
          <li>The grid updates the moment you build, even while paused. A flashing bolt on a lot means no power reaches it yet.</li>
          <li>When a grid needs more than its plants make, the lots furthest from its plants go dark first. The news ticker warns about brownouts.</li>
          <li>Plants only share power within one connected grid. Two plants on grids that never touch can leave one short while the other has plenty spare, even when the Report's city-wide total looks fine. The Power grid layer shows overloaded grids in orange, and Inspect on any lot or line gives its grid's load.</li>
        </ul>
        ${Xe("Build the next plant when demand reaches about 80% of supply. The Report shows both numbers.")}`},{id:"traffic",title:"Roads, rail and traffic",html:`
        ${Ye(["","Cost per tile","Bridge","Upkeep","Steepest step it climbs"],[["Road",be(qe.road),be(gt.road),`$${He.road}/mo`,`${Dt.road} m`],["Rail",be(qe.rail),be(gt.rail),`$${He.rail}/mo`,`${Dt.rail} m`],["Power line",be(qe.power),be(gt.power),"free","any"]],[1,2,3,4])}
        <p>Residents spread their commutes over the city\u2019s biggest employers, so traffic piles up on the roads leading downtown and into the industrial district. Busy roads add pollution and lower nearby land value, and jammed roads make commutes slower, which spreads traffic onto parallel streets.</p>
        <ul>
          <li><b>Rail</b> is cheaper to travel on than any road, and trips by rail add no cars. Link rail to the road network at both ends and it pulls commuters off the busiest streets. A street can cross the track: trains pass through without adding cars. Lots that touch a rail line put their commuters straight on the train, though they still need a road touching them to grow.</li>
          <li><b>Mixed zoning</b> shortens commutes. A pocket of commercial lots inside a residential district keeps many trips off the main roads.</li>
          <li><b>Parallel roads</b> share the load. One long arterial carrying everything will jam.</li>
        </ul>
        ${Xe("Turn on the Traffic layer to see which roads are jammed before you build anything to fix them.")}`},{id:"money",title:"Money",html:`
        <p>Taxes arrive monthly. Every resident pays, jobs count for 70% of a resident, and the total is scaled by the city\u2019s average land value. A city of valuable land collects up to 2.6 times as much per person as a cheap one, so raising land value is the best way to raise revenue.</p>
        <ul>
          <li><b>7%</b> keeps demand neutral. Residents start to grumble about taxes above about 12%, and every point above 7% slows growth.</li>
          <li><b>Upkeep</b> is charged monthly: roads and rail by the tile, police and fire by the station (scaled by their funding), and each plant and service building.</li>
          <li><b>Loans</b> come in $10,000 steps up to $30,000 at 7% a year. They are worth it to fund a plant or a landmark that unlocks growth, not to cover running costs.</li>
          <li><b>In debt</b> nothing new can be built, but bulldozing still works at $1 a tile, so you can clear away what the city can\u2019t afford to run.</li>
          <li><b>Underfunding</b> police or fire weakens their reach. Cutting roads and rail below 90% makes tiles crumble into rubble every month.</li>
        </ul>
        ${Xe("The Budget pauses the game and shows last month and the year so far line by line. The History charts show whether income is keeping up with spending.")}`},{id:"services",title:"Services and landmarks",html:`
        ${Ye(["Building","Cost","Upkeep","What it does"],t.map(([i,s])=>[r[i].name,be(r[i].cost),r[i].upkeep<1?`$${r[i].upkeep}/mo`:`${be(r[i].upkeep)}/mo`,s]),[1,2])}
        <p>Crime grows where people are crowded and land is cheap. Police coverage cancels it out, so place stations in dense, low-value neighbourhoods first. Service buildings need power too; an unpowered station works at about a third of its strength.</p>
        <p>Once a city has money to spare, each landmark can be upgraded twice from its Inspect card. Every upgrade raises land value across the whole city by ${be(et*40)}/acre, so homes and shops can grow denser and taxes bring in more, but they cost a lot and add to the upkeep. Only the most upgraded stadium, seaport and airport count, so upgrading a second one adds nothing.</p>
        ${Ye(["Landmark","First upgrade","Second upgrade"],["stadium","seaport","airport"].map(i=>[r[i].name,...Et[i].map(s=>`${s.name}<br>${be(s.cost)}, +${be(s.upkeep)}/mo`)]))}
        ${Xe("Turn on the Police reach, Fire cover or Schools & health layer to find the gaps in coverage.")}`},{id:"terrain",title:"Building on hills",html:`
        <ul>
          <li><b>Zones and buildings</b> level their own lot when the ground is moderately sloped, up to ${di} times their normal limit. The cursor price includes the earthworks.</li>
          <li><b>Roads and rail</b> only care about the slope along the line, so they can run across a hillside freely. Where they climb too steeply they cut themselves a ramp, also priced in.</li>
          <li><b>Level land</b> (<kbd>L</kbd>) is for anything steeper. Hold it over the slope and it flattens toward the height where you first pressed, at ${be(We)} per metre of earth moved. Selecting it turns on the Steepness layer, and the cursor shows the steepness underneath.</li>
        </ul>
        ${Xe("High ground adds land value, and so does a view of water. A gentle hillside above a lake is prime residential land.")}`},{id:"disasters",title:"Disasters",html:`
        <p>Random disasters start once a city passes ${_e.toLocaleString()} residents, about when it needs its first fire station, and can be switched off from the Disasters menu. Harder difficulties bring them more often.</p>
        ${Ye(["Disaster","How to prepare"],[["Fire","The most common by far. Fire stations prevent fires and put them out. Buildings far from a station catch fire more often, and fire spreads through trees and touching buildings. Bulldoze a gap to stop it."],["Flood","Starts on low shoreline and spreads over land a few metres above the water. Keep valuable buildings on higher ground."],["Tornado","Wanders near the town centre. You cannot stop it, so keep money in reserve to rebuild."],["Earthquake","Wrecks buildings and roads within about 16 tiles and starts fires. Good fire cover limits the damage."],["Monster","Appears only when pollution is high, comes out of the water, and heads for the most polluted spot, leaving fires in what it wrecks. Clean air keeps it away."],["Meltdown","Only with a nuclear plant: a small chance each month, or if the plant is destroyed. It contaminates the area for years."]])}
        ${Xe("Every message in the news ticker with a location has a Go there button.")}`},{id:"challenges",title:"Challenges",html:`
        ${Ye(["Challenge","How to approach it"],[["Boomtown","Money is tight. Build one coal plant and lay roads every 7 tiles to save asphalt. Then zone well ahead of the RCI meter, a dozen or more lots of housing and a few of shops and industry early on: each lot fills in slowly, so the number of lots sets the pace, and money for roads is the limit, not demand. Twelve thousand residents needs roughly six thousand jobs."],["Gridlock","The city opens with about 17,500 people and more jobs than it can keep: with no airport or seaport, shops and factories shrink back to the landmark limits, and people leave with the jobs. Build both to hold on to 10,000 jobs. Every new job and resident brings more cars, though, so run rail from the outer housing into downtown, add parallel roads beside the busy ones, and zone pockets of commerce inside the residential rings. Schools, hospitals and parks raise land value, which lets the city grow denser, and busier."],["Smog Valley","The coal plants are the worst polluters. Replace them with nuclear, solar or wind, plant trees and parks between the factories and the homes, and bulldoze the industry that sits closest to houses. Housing stops at 18,000 residents until you build a stadium. The goal has to hold at every month end of the last year, so get there with time to spare."],["Aftershock","Put the fires out first: check fire cover and bulldoze firebreaks. Then clear rubble, reconnect roads and power, push land value up with hospitals and schools, and build a seaport so industry can grow, to reach 55,000."],["Monster Bay","The monster returns about every two years and makes for the smoke, which here means the coal plants. Switch to solar or wind: a nuclear plant the monster smashes melts down. Keep fire cover up for the fires it starts, and keep taxes near 7% to hold approval above 60%. Housing stops at 18,000 residents until you build a stadium."]])}`},{id:"classes",title:"City sizes and score",html:`${Ye(["Class","Residents"],me.map(i=>[i.name,i.min?`${i.min.toLocaleString()}+`:"under 2,000"]),[1])}
        <p>The city report scores the city out of 1,000. The mayor\u2019s approval weighs most, 7 points for each percent, up to 700. Each size class past ${me[0].name} adds 50, up to ${(me.length-1)*50} for a ${me[me.length-1].name.toLowerCase()}, and land value adds up to 50. The History charts show the approval behind it.</p>`}]}function Ys(r,e){let t=new zt(r),i=Math.max(r.w,r.h),s=document.createElement("canvas");s.width=s.height=i*e;let o=s.getContext("2d"),n=document.createElement("canvas");if(n.width=r.w*e,n.height=r.h*e,!o)return n;o.putImageData(pi(o,t,r,0,0,i,e,!1),0,0);let a={ctx:o,L:e,world:r};for(let d=0;d<r.h;d++)for(let c=0;c<r.w;c++)!r.occ[d*r.w+c]&&r.trees[d*r.w+c]&&bi(a,c,d);for(let d=0;d<r.h;d++)for(let c=0;c<r.w;c++)r.net[d*r.w+c]&&yi(a,c,d);let l=[...r.buildings.values()].sort((d,c)=>d.y+d.size-(c.y+c.size));for(let d of l)vt(a,d);return n.getContext("2d")?.drawImage(s,0,0),n}function jr(){let r=new fe(22,12);r.height.fill(3);for(let i=0;i<r.h;i++)for(let s=20;s<r.w;s++)r.water[i*r.w+s]=1,r.height[i*r.w+s]=-2;for(let i=9;i<12;i++)for(let s=13;s<19;s++)r.trees[i*r.w+s]=1+(s*7+i*3)%3;let e=(i,s,o,n,a=1)=>{for(let l=s;l<=n;l++)for(let d=i;d<=o;d++)r.net[l*r.w+d]|=a};e(5,1,19,1,5),e(5,8,19,8),e(5,1,5,11),e(12,1,12,8),e(19,1,19,8),e(4,1,4,1,4),r.place("coal",0,1,11);let t=(i,s,o,n,a)=>r.setLevel(r.place(i,s,o,a),n);t("res",6,2,3,21),t("res",9,2,4,5),t("res",6,5,2,8),t("com",9,5,2,13),t("res",13,2,5,17),t("res",16,2,4,3),t("res",13,5,3,29);for(let i=5;i<8;i++)for(let s=16;s<19;s++)r.place("park",s,i,s*3+i);return t("ind",6,9,3,41),t("ind",9,9,2,43),r}function Kr(r,e,t){let i=new fe(3,3);i.height.fill(3);let s=i.place(r,0,0,1e3+e*37+r.length);return i.setLevel(s,e),Ys(i,t)}function Vr(r){let e=Math.min(window.devicePixelRatio||1,2),t=r.querySelector('[data-scene="starter"]');if(t){let i=Ys(jr(),20*e);i.style.width="100%",i.style.maxWidth="660px",i.setAttribute("role","img"),i.setAttribute("aria-label","A starter town with a coal plant, roads, homes, a
